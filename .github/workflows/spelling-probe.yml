name: Isolated spelling verification probe
on:
  push:
    branches: [codex/verify-painted-manuscript]
    paths: [scripts/spelling-probe/**, .github/workflows/spelling-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check magnified glyphs in correct and misspelled synthetic lettering
        env:
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        run: node scripts/spelling-probe/run.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-spelling-probe
          path: spelling-probe-output/encrypted.json
          retention-days: 1
